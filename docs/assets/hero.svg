<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1200" aria-labelledby="t d" role="img" viewBox="0 0 2400 1200"><title id="t">Testate. Git for your test database.</title><desc id="d">Your test server holds your app and its databases. Testate docks beside them as one container, takes snapshots and puts them back, and testers, developers, CI/CD, DevOps and AI agents come in through it.</desc><defs><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur stdDeviation="28"/></filter></defs><rect width="2400" height="1200" fill="#05070a"/><radialGradient id="g1" cx=".7" cy=".5" r=".5"><stop offset="0" stop-color="#7dd3c0" stop-opacity=".12"/><stop offset="1" stop-color="#7dd3c0" stop-opacity="0"/></radialGradient><rect width="2400" height="1200" fill="url(#g1)"/><g transform="translate(112 64) scale(0.48)"><g fill="none" stroke="#7dd3c0" stroke-linecap="round" stroke-width="9"><line x1="44" x2="44" y1="104" y2="30"/><path d="M44 66 C44 48 84 60 84 42"/></g><circle cx="44" cy="104" r="11" fill="#7dd3c0"/><circle cx="84" cy="42" r="11" fill="#7dd3c0"/><circle cx="44" cy="30" r="15" fill="#10b981"/><circle cx="44" cy="30" r="6" fill="#0b1017"/></g><text x="188" y="108" fill="#eef2f5" font-family="'Mona Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="650" letter-spacing="-.8">Test<tspan fill="#10b981">ate</tspan></text><text x="120" y="372" fill="#7dd3c0" font-family="'Mona Sans Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" letter-spacing="2.6">SELF-HOSTED · V1.2.0 · MIT</text><text x="114" y="520" fill="#eef2f5" font-family="'Mona Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="150" font-weight="650" letter-spacing="-5">Git for your</text><text x="114" y="670" fill="#eef2f5" font-family="'Mona Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="150" font-weight="650" letter-spacing="-5">test database.</text><text x="120" y="770" fill="#8b96a3" font-family="'Mona Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" letter-spacing="-.4">Snapshot the databases behind a system under test.</text><text x="120" y="822" fill="#8b96a3" font-family="'Mona Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" letter-spacing="-.4"><tspan fill="#eef2f5" font-weight="550">Break them. Put them back in seconds,</tspan></text><text x="120" y="874" fill="#8b96a3" font-family="'Mona Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" letter-spacing="-.4">and see exactly what changed.</text><text x="120" y="1060" fill="#566270" font-family="'Mona Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24">Self-hosted, beside the system it tests. Nothing installs inside your app.</text><g><g opacity="0" transform="translate(980 110) scale(0.88)"><animate attributeName="opacity" dur="13s" keyTimes="0.0000;0.0008;0.9538;1.0000" repeatCount="indefinite" values="0;1;1;0"/><g opacity="0"><animate attributeName="opacity" dur="13s" keyTimes="0.0000;0.0154;0.0769;1.0000" repeatCount="indefinite" values="0;0;1;1"/><rect width="1110" height="790" x="440" y="110" fill="rgba(238,242,245,0.025)" stroke="rgba(238,242,245,0.28)" stroke-dasharray="10 8" stroke-width="1.5" rx="26"/><rect width="470" height="32" x="462" y="94" fill="#05070a"/><text x="476" y="118" fill="#7dd3c0" font-family="'Mona Sans Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="21" letter-spacing="2.4">YOUR TEST SERVER · DEV, SIT OR UAT</text><rect width="380" height="140" x="1120" y="180" fill="#0b1017" stroke="rgba(238,242,245,0.28)" stroke-width="1.5" rx="18"/><text x="1310" y="240" fill="#eef2f5" font-family="'Mona Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="650" letter-spacing="-.6" text-anchor="middle">Your app</text><text x="1310" y="282" fill="#8b96a3" font-family="'Mona Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" text-anchor="middle">the system under test</text><rect width="380" height="260" x="1120" y="560" fill="#0b1017" stroke="rgba(238,242,245,0.28)" stroke-width="1.5" rx="18"/><text x="1310" y="624" fill="#eef2f5" font-family="'Mona Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="650" letter-spacing="-.6" text-anchor="middle">Its databases</text><text x="1310" y="676" fill="#8b96a3" font-family="'Mona Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" text-anchor="middle">PostgreSQL · MySQL · MariaDB</text><text x="1310" y="716" fill="#8b96a3" font-family="'Mona Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" text-anchor="middle">MongoDB · any S3 · SFTP · FTP</text><text x="1310" y="776" fill="#566270" font-family="'Mona Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-style="italic" text-anchor="middle">reset by hand, until now</text><line x1="1310" x2="1310" y1="320" y2="544" stroke="rgba(238,242,245,0.28)" stroke-width="2"/><polygon fill="rgba(238,242,245,0.28)" points="1310 560 1301 544 1319 544"/><text x="1328" y="446" fill="#8b96a3" font-family="'Mona Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20">reads and writes</text></g><g opacity="0"><animate attributeName="opacity" dur="13s" keyTimes="0.0000;0.1077;0.1308;1.0000" repeatCount="indefinite" values="0;0;1;1"/><text x="500" y="300" fill="#7dd3c0" font-family="'Mona Sans Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20">$ docker run ghcr.io/pt-perkasa-pilar-utama/testate</text></g><g transform="translate(-1200 0)"><animateTransform attributeName="transform" calcMode="spline" dur="13s" keySplines="0 0 1 1;0.16 1 0.3 1;0 0 1 1" keyTimes="0.0000;0.1462;0.2231;1.0000" repeatCount="indefinite" type="translate" values="-1200 0;-1200 0;0 0;0 0"/><rect width="420" height="460" x="500" y="330" fill="#10b981" filter="url(#glow)" opacity=".08" rx="20"/><rect width="420" height="460" x="500" y="330" fill="#0b1017" stroke="#10b981" stroke-width="1.5" rx="18"/><g transform="translate(540 366) scale(0.5)"><g fill="none" stroke="#7dd3c0" stroke-linecap="round" stroke-width="9"><line x1="44" x2="44" y1="104" y2="30"/><path d="M44 66 C44 48 84 60 84 42"/></g><circle cx="44" cy="104" r="11" fill="#7dd3c0"/><circle cx="84" cy="42" r="11" fill="#7dd3c0"/><circle cx="44" cy="30" r="15" fill="#10b981"/><circle cx="44" cy="30" r="6" fill="#0b1017"/></g><text x="614" y="412" fill="#eef2f5" font-family="'Mona Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="650" letter-spacing="-.8">Test<tspan fill="#10b981">ate</tspan></text><line x1="540" x2="880" y1="446" y2="446" stroke="rgba(238,242,245,0.16)" stroke-width="1.5"/><circle cx="552" cy="484" r="5" fill="#7dd3c0"/><text x="574" y="492" fill="#eef2f5" font-family="'Mona Sans Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="26">snapshot</text><circle cx="552" cy="534" r="5" fill="#7dd3c0"/><text x="574" y="542" fill="#eef2f5" font-family="'Mona Sans Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="26">check out</text><circle cx="552" cy="584" r="5" fill="#7dd3c0"/><text x="574" y="592" fill="#eef2f5" font-family="'Mona Sans Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="26">diff</text><circle cx="552" cy="634" r="5" fill="#7dd3c0"/><text x="574" y="642" fill="#eef2f5" font-family="'Mona Sans Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="26">import fixtures</text><circle cx="552" cy="684" r="5" fill="#7dd3c0"/><text x="574" y="692" fill="#eef2f5" font-family="'Mona Sans Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="26">MCP for agents</text><text x="540" y="742" fill="#7dd3c0" font-family="'Mona Sans Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18">1 container · 1 volume</text><text x="540" y="772" fill="#8b96a3" font-family="'Mona Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19">Beside the app. Nothing installs inside it.</text></g><g opacity="0"><animate attributeName="opacity" dur="13s" keyTimes="0.0000;0.2462;0.2615;1.0000" repeatCount="indefinite" values="0;0;1;1"/><line x1="1120" x2="944" y1="610" y2="610" stroke="#8dd6ff" stroke-dasharray="176" stroke-dashoffset="176" stroke-width="2.5"><animate attributeName="stroke-dashoffset" dur="13s" keyTimes="0.0000;0.2462;0.2846;1.0000" repeatCount="indefinite" values="176;176;0;0"/></line><polygon fill="#8dd6ff" points="936 610 952 601 952 619" opacity="0"><animate attributeName="opacity" dur="13s" keyTimes="0.0000;0.2808;0.2923;1.0000" repeatCount="indefinite" values="0;0;1;1"/></polygon><text x="1030" y="592" fill="#8dd6ff" font-family="'Mona Sans Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="19" text-anchor="middle">snapshot</text><line x1="920" x2="1104" y1="740" y2="740" stroke="#10b981" stroke-dasharray="184" stroke-dashoffset="184" stroke-width="2.5"><animate attributeName="stroke-dashoffset" dur="13s" keyTimes="0.0000;0.2692;0.3077;1.0000" repeatCount="indefinite" values="184;184;0;0"/></line><polygon fill="#10b981" points="1112 740 1096 731 1096 749" opacity="0"><animate attributeName="opacity" dur="13s" keyTimes="0.0000;0.3038;0.3154;1.0000" repeatCount="indefinite" values="0;0;1;1"/></polygon><text x="1030" y="770" fill="#10b981" font-family="'Mona Sans Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="19" text-anchor="middle">put it back</text><circle r="6" fill="#8dd6ff" opacity="0"><animateMotion begin="4.4s" calcMode="spline" dur="1.6s" keySplines="0.4 0 0.6 1" keyTimes="0;1" path="M1120,610 L944,610" repeatCount="indefinite"/><animate attributeName="opacity" begin="4.4s" dur="1.6s" keyTimes="0;0.15;0.85;1" repeatCount="indefinite" values="0;1;1;0"/></circle><circle r="6" fill="#10b981" opacity="0"><animateMotion begin="5.2s" calcMode="spline" dur="1.6s" keySplines="0.4 0 0.6 1" keyTimes="0;1" path="M920,740 L1104,740" repeatCount="indefinite"/><animate attributeName="opacity" begin="5.2s" dur="1.6s" keyTimes="0;0.15;0.85;1" repeatCount="indefinite" values="0;1;1;0"/></circle></g><g opacity="0"><animate attributeName="opacity" dur="13s" keyTimes="0.0000;0.3231;0.3500;1.0000" repeatCount="indefinite" values="0;0;1;1"/><rect width="330" height="76" x="60" y="352" fill="#0b1017" stroke="rgba(238,242,245,0.28)" stroke-width="1.5" rx="18"/><text x="88" y="388" fill="#eef2f5" font-family="'Mona Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="-.4">Testers</text><text x="88" y="414" fill="#8b96a3" font-family="'Mona Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17">the dashboard</text><line x1="390" x2="500" y1="390" y2="390" stroke="rgba(238,242,245,0.28)" stroke-dasharray="110" stroke-dashoffset="110" stroke-width="2"><animate attributeName="stroke-dashoffset" dur="13s" keyTimes="0.0000;0.3385;0.3692;1.0000" repeatCount="indefinite" values="110;110;0;0"/></line><circle r="6" fill="#7dd3c0" opacity="0"><animateMotion begin="5s" calcMode="spline" dur="1.4s" keySplines="0.4 0 0.6 1" keyTimes="0;1" path="M390,390 L500,390" repeatCount="indefinite"/><animate attributeName="opacity" begin="5s" dur="1.4s" keyTimes="0;0.15;0.85;1" repeatCount="indefin